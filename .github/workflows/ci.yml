name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # kit's own test-coverage gate, enforced. `.kit-baseline.json` is committed, so
      # the 91 pre-existing untested files are frozen and only a NET-NEW untested
      # source file fails this step. Without --enforce-tests the same finding is a
      # warning nobody reads; the mechanism existed for six majors and ran in zero
      # workflows. --category tests narrows the run to that one dimension.
      - name: Test-coverage gate (net-new untested files)
        run: node dist/cli.js check --category tests --enforce-tests

      # kit's own ADR gate, enforced. Measured before wiring it: three accepted ADRs
      # carry four deterministic `kit-enforce` rules, they catch real violations (an
      # `openai` import, a `lodash` import, a coverage-registry import from the check
      # path each exit 1), and nothing in this repo ran them. Not pre-commit, not
      # pre-push, not CI — `kit check` does not include the ADR stage, only
      # `kit review` does, and no workflow called either. The rules were armed and
      # never fired for a month: enforcement that happens only when a human remembers
      # to type the command is documentation with a CLI.
      #
      # Hard fail, not a warning: the gate is clean today (0 violations), so failing
      # closed costs nothing now and means something the first time it does not. Only
      # `status: accepted` ADRs gate, prose is never interpreted, and an accepted ADR
      # with no enforce block is reported as "documented, not enforced", never green.
      # `ci-adr-gate.test.ts` pins this step's existence — deleting it fails the suite.
      - name: ADR gate (accepted ADRs' kit-enforce rules)
        run: node dist/cli.js adr check

      # SKILL DISCIPLINE — same failure class as the ADR gate above, found the same way.
      # `kit skill test --gate` has always exited 1 on a failing skill and nothing ever ran
      # it: not CI, not `kit review`, not verify-suite.sh. Measured the day this landed, kit's
      # ONLY shipped SKILL.md failed kit's own linter (no `allowed-tools` — the skill
      # implicitly claimed every tool) for as long as the linter had existed, and no pipeline
      # said a word. A tool that lints skills while shipping one that fails it is not a gate,
      # it is advice.
      #
      # This runs the `skill` stage of `kit review`, so it covers every SKILL.md the repo
      # ships rather than one hard-coded path — a second skill cannot be added un-gated.
      # Module discipline only: contract, trigger collision, BOUNDED tool scope, and drift
      # from the committed snapshot. Whether a skill's output is any GOOD is a model
      # judgement and stays outside kit (ADR-0001). A repo with no skills skips honestly.
      # `ci-adr-gate.test.ts` pins this step's existence — deleting it fails the suite.
      - name: Skill gate (module discipline for every shipped SKILL.md)
        run: node dist/cli.js review --stages skill
