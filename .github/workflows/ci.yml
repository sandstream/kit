name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # kit's own test-coverage gate, enforced. `.kit-baseline.json` is committed, so
      # the 91 pre-existing untested files are frozen and only a NET-NEW untested
      # source file fails this step. Without --enforce-tests the same finding is a
      # warning nobody reads; the mechanism existed for six majors and ran in zero
      # workflows. --category tests narrows the run to that one dimension.
      - name: Test-coverage gate (net-new untested files)
        run: node dist/cli.js check --category tests --enforce-tests
