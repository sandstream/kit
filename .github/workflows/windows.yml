# Native Windows compatibility probe (#43). The verifier-authority slice is a
# required gate because an ACL failure must never produce a false approval. The
# complete unit suite is also required; platform failures must fail this workflow.
#
# The suite is split into four shards that run in parallel (scripts/test-shard.mjs splits the
# compiled test files by size, so every file runs exactly once). One shard took the whole suite and
# about 45 minutes on this runner; a shard takes about a quarter of that. The job named
# `windows-native` stays as the single result: it passes only when every shard passed.
name: Windows (native, probe)

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: Compiled test path under dist/ for a focused Windows run
        required: false
        default: ""
      test_name_pattern:
        description: Optional Node test name pattern for a focused run
        required: false
        default: ""
      time_files:
        description: Set to "true" to print per-file wall times for each shard instead of running the suite (#675)
        required: false
        default: ""
  pull_request: {}
  push:
    branches:
      - "windows-ci/**"

permissions:
  contents: read

jobs:
  windows-shard:
    name: windows shard ${{ matrix.shard }}/4
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build (cross-platform — no POSIX rm/chmod)
        run: npm run build
      - name: Memory verifier authority (required)
        run: node --test dist/memory/pal-authority-windows.test.js
      - name: Focused Windows test
        if: inputs.test_file != '' && matrix.shard == 1
        shell: pwsh
        env:
          KIT_TEST_FILE: ${{ inputs.test_file }}
          KIT_TEST_PATTERN: ${{ inputs.test_name_pattern }}
        run: |
          if ($env:KIT_TEST_FILE -notmatch '^dist[/\\][a-zA-Z0-9/_\\.-]+\.test\.js$') {
            throw 'test_file must name a compiled test under dist/'
          }
          if (($env:KIT_TEST_FILE -split '[/\\]') -contains '..') {
            throw 'test_file must remain under dist/'
          }
          $testArgs = @('--test', '--test-timeout=180000')
          if ($env:KIT_TEST_PATTERN) { $testArgs += "--test-name-pattern=$env:KIT_TEST_PATTERN" }
          $testArgs += $env:KIT_TEST_FILE
          & node @testArgs
      - name: Per-file timing (shard ${{ matrix.shard }}/4, dispatch only)
        if: inputs.time_files == 'true'
        shell: bash
        env:
          KIT_TEST_SHARD: ${{ matrix.shard }}/4
        run: node scripts/time-test-files.mjs
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        if: inputs.test_file == '' && inputs.time_files != 'true'
        shell: bash
        env:
          KIT_TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          set -o pipefail
          npm test 2>&1 | tee win-tests.log
      - name: Upload Windows test log (full output — gh logs truncate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-log-${{ matrix.shard }}
          path: win-tests.log
          if-no-files-found: ignore
      - name: kit smoke (init / check) — gaps surface here, non-blocking
        if: matrix.shard == 1
        continue-on-error: true # kit-self-audit: allow-continue-on-error
        run: |
          node dist/cli.js --version
          node dist/cli.js check --category security

  # The single Windows result. Its name is the one the pull request has always shown, so a rule that
  # names it keeps working. It fails when any shard failed, was cancelled or did not run.
  windows-native:
    name: windows-native
    needs: windows-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard must have passed
        env:
          SHARDS: ${{ needs.windows-shard.result }}
        run: |
          echo "windows-shard result: $SHARDS"
          test "$SHARDS" = "success"
