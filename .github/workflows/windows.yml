# Native Windows compatibility probe (#43). The verifier-authority slice is a
# required gate because an ACL failure must never produce a false approval. The
# complete unit suite is also required; platform failures must fail this workflow.
#
# The suite is split into four shards that run in parallel (scripts/test-shard.mjs splits the
# compiled test files by size, so every file runs exactly once). One shard took the whole suite and
# about 45 minutes on this runner; a shard takes about a quarter of that. The job named
# `windows-native` stays as the single result: it passes only when every shard passed.
name: Windows (native, probe)

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: Compiled test path under dist/ for a focused Windows run
        required: false
        default: ""
      test_name_pattern:
        description: Optional Node test name pattern for a focused run
        required: false
        default: ""
      probe_shell:
        description: Compare the focused audit test under PowerShell and Git Bash
        required: false
        default: "false"
  pull_request: {}
  push:
    branches:
      - "windows-ci/**"

permissions:
  contents: read

jobs:
  windows-shard:
    name: windows shard ${{ matrix.shard }}/4
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build (cross-platform — no POSIX rm/chmod)
        run: npm run build
      - name: Memory verifier authority (required)
        run: node --test dist/memory/pal-authority-windows.test.js
      - name: Record PowerShell environment shape
        if: inputs.probe_shell == 'true' && matrix.shard == 1
        shell: pwsh
        run: |
          node -e "const x=process.env.PSModulePath || ''; console.log(JSON.stringify({shell:'pwsh',present:!!x,length:x.length,semicolons:(x.match(/;/g)||[]).length,colons:(x.match(/:/g)||[]).length}));"
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\kit-pwsh-module-path.txt", $env:PSModulePath)
      - name: Probe minimal PowerShell module paths
        if: inputs.probe_shell == 'true' && matrix.shard == 1
        shell: bash
        run: node scripts/diagnostics/windows-module-probe.cjs
      - name: Focused Windows test
        if: inputs.test_file != '' && matrix.shard == 1
        shell: pwsh
        env:
          KIT_TEST_FILE: ${{ inputs.test_file }}
          KIT_TEST_PATTERN: ${{ inputs.test_name_pattern }}
        run: |
          if ($env:KIT_TEST_FILE -notmatch '^dist[/\\][a-zA-Z0-9/_\\.-]+\.test\.js$') {
            throw 'test_file must name a compiled test under dist/'
          }
          if (($env:KIT_TEST_FILE -split '[/\\]') -contains '..') {
            throw 'test_file must remain under dist/'
          }
          $testArgs = @('--test', '--test-timeout=180000')
          if ($env:KIT_TEST_PATTERN) { $testArgs += "--test-name-pattern=$env:KIT_TEST_PATTERN" }
          $testArgs += $env:KIT_TEST_FILE
          & node @testArgs
      - name: Run the same focused test under Git Bash
        if: ${{ !cancelled() && inputs.probe_shell == 'true' && matrix.shard == 1 }}
        shell: bash
        run: |
          node -e "const x=process.env.PSModulePath || ''; console.log(JSON.stringify({shell:'bash',present:!!x,length:x.length,semicolons:(x.match(/;/g)||[]).length,colons:(x.match(/:/g)||[]).length}));"
          set +e
          node --test --test-timeout=180000 --test-concurrency=1 dist/review-receipt-audit-cli.test.js > "$RUNNER_TEMP/kit-acl-shell-probe.log" 2>&1
          status=$?
          echo 'Results with original Bash environment:'
          grep -E '^not ok|^ok |^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/kit-acl-shell-probe.log" || true
          if grep -q 'ETIMEDOUT' "$RUNNER_TEMP/kit-acl-shell-probe.log"; then echo 'Detected ETIMEDOUT'; fi
          if grep -q 'Unexpected gh invocation' "$RUNNER_TEMP/kit-acl-shell-probe.log"; then echo 'Detected Unexpected gh invocation'; fi
          PSModulePath="$(cat "$RUNNER_TEMP/kit-pwsh-module-path.txt")" node --test --test-timeout=180000 --test-concurrency=1 dist/review-receipt-audit-cli.test.js > "$RUNNER_TEMP/kit-acl-shell-override.log" 2>&1
          override_status=$?
          echo 'Results with PowerShell module path:'
          grep -E '^not ok|^ok |^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/kit-acl-shell-override.log" || true
          if grep -q 'ETIMEDOUT' "$RUNNER_TEMP/kit-acl-shell-override.log"; then echo 'Detected ETIMEDOUT'; fi
          native_modules=$(node -e 'process.stdout.write(require("node:path").join(process.env.SystemRoot,"System32","WindowsPowerShell","v1.0","Modules"))')
          PSModulePath="$native_modules" node --test --test-timeout=180000 --test-concurrency=1 dist/review-receipt-audit-cli.test.js > "$RUNNER_TEMP/kit-acl-shell-minimal.log" 2>&1
          minimal_status=$?
          echo 'Results with Windows system modules only:'
          grep -E '^not ok|^ok |^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/kit-acl-shell-minimal.log" || true
          if grep -q 'ETIMEDOUT' "$RUNNER_TEMP/kit-acl-shell-minimal.log"; then echo 'Detected ETIMEDOUT'; fi
          PSModulePath="" node --test --test-timeout=180000 --test-concurrency=1 dist/review-receipt-audit-cli.test.js > "$RUNNER_TEMP/kit-acl-shell-empty.log" 2>&1
          empty_status=$?
          echo 'Results with empty module path:'
          grep -E '^not ok|^ok |^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/kit-acl-shell-empty.log" || true
          if grep -q 'ETIMEDOUT' "$RUNNER_TEMP/kit-acl-shell-empty.log"; then echo 'Detected ETIMEDOUT'; fi
          test "$status" -eq 0 && test "$override_status" -eq 0 && test "$minimal_status" -eq 0 && test "$empty_status" -eq 0
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        if: inputs.test_file == ''
        shell: bash
        env:
          KIT_TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          set -o pipefail
          npm test 2>&1 | tee win-tests.log
      - name: Upload Windows test log (full output — gh logs truncate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-log-${{ matrix.shard }}
          path: win-tests.log
          if-no-files-found: ignore
      - name: kit smoke (init / check) — gaps surface here, non-blocking
        if: matrix.shard == 1
        continue-on-error: true # kit-self-audit: allow-continue-on-error
        run: |
          node dist/cli.js --version
          node dist/cli.js check --category security

  # The single Windows result. Its name is the one the pull request has always shown, so a rule that
  # names it keeps working. It fails when any shard failed, was cancelled or did not run.
  windows-native:
    name: windows-native
    needs: windows-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows shard must have passed
        env:
          SHARDS: ${{ needs.windows-shard.result }}
        run: |
          echo "windows-shard result: $SHARDS"
          test "$SHARDS" = "success"
