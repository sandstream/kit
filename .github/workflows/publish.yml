name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protected environment gate. There is no npm token here any more: all 13 packages
    # have a GitHub Actions trusted publisher naming this repo, THIS workflow file, and
    # THIS environment, so npm mints a short-lived credential from the job's OIDC identity
    # and only for runs that reach this environment. That makes the environment part of the
    # credential rather than merely the guard around a secret — configure required reviewers
    # on `npm-publish` in Settings → Environments, or the human gate does not exist.
    #
    # The npm side is what enforces the workflow name and environment; keep this job
    # triggered directly by the tag push. Behind `workflow_call`, npm's validation reads the
    # CALLING workflow's name and the check breaks. See docs/RELEASING.md.
    environment: npm-publish
    permissions:
      # write (not read) because this job creates the GitHub release for the tag
      # and uploads the SBOMs to it. Scoped to this job only; every other
      # workflow in the repo stays read-only.
      contents: write # checkout + create release / upload SBOM assets
      id-token: write # npm provenance via OIDC (SLSA attestation)
      packages: write
      attestations: write # GitHub artifact attestations

    steps:
      # SHA-pinned actions — protects against tag-rewrite supply-chain attacks.
      # Updates handled by Dependabot. See:
      # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so semantic-release / changelog tools work + git audits.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install an npm that can do trusted publishing
        # npm is retiring 2FA-bypass granular access tokens as a publishing credential: from
        # ~January 2027 such a token can only read private packages and STAGE a publish for
        # human 2FA approval. The migration target is trusted publishing — an OIDC exchange
        # with NO long-lived secret — and it exists only in npm >= 11.5.1 (node >= 22.14.0).
        # setup-node ships npm 10.9.x for node 22, so the client in this job would have no
        # OIDC exchange to make. Installed here so the prerequisite is already true when the
        # registry-side switch lands (13 per-package configs on npmjs.com — docs/RELEASING.md).
        #
        # Measured on npm 11.19.0 against this repo before wiring: `npm ci` and
        # `npm publish --dry-run` both behave identically, and npm >= 11's skip-install-scripts
        # default costs nothing here (esbuild's postinstall is the only one in the tree, and
        # the build + tests pass without it). Asserted by src/publish-workflow.test.ts.
        run: |
          npm i -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        # npm ci uses package-lock.json exactly — no version drift.
        run: npm ci

      - name: Verify tag matches package.json version
        # Refuse to publish if someone pushes `v1.2.3` but package.json says
        # something else. Catches accidental tag/version skew before npm sees it.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG_VERSION"

      - name: Verify the adapter-SDK contract the plugins are published against
        # The workspaces are DELIBERATELY NOT in lockstep with the CLI. README.md:574 —
        # "adapter-sdk@1.0 is frozen on its own semver track, decoupled from kit's version" — and
        # public-surface.test.ts asserts `/^1\./`. That decoupling is the right call for an SDK
        # third parties build against: a major that tracked the CLI would force every external
        # plugin to bump its peerDependency range on each kit release for no API reason.
        #
        # So the invariant worth gating is not "same version everywhere", it is:
        #   1. the SDK major stays 1.x (the frozen public contract), and
        #   2. every plugin's declared peer range actually admits the SDK version being published,
        #      because those two are published together in the step below — a plugin that ships
        #      requiring a peer we did not publish is an install-time failure for the user, not a
        #      problem the next release can quietly fix.
        run: |
          set -euo pipefail
          SDK_VER="$(node -p "require('./packages/adapter-sdk/package.json').version")"
          case "$SDK_VER" in
            1.*) : ;;
            *) echo "::error::adapter-sdk is $SDK_VER but its public contract is frozen at 1.x (README.md, public-surface.test.ts). Publishing a new major is a deliberate breaking change: update the frozen-major assertion and the compatibility matrix in the same PR."; exit 1 ;;
          esac
          BAD=""
          for dir in $(ls -d packages/kit-plugin-*/ | sed 's:/$::' | sort); do
            NAME="$(node -p "require('./$dir/package.json').name")"
            RANGE="$(node -p "const p=require('./$dir/package.json');(p.peerDependencies||{})['sandstream-kit-adapter-sdk']||''")"
            [ -z "$RANGE" ] && continue
            # semver.satisfies via npm's own bundled semver — no new dependency.
            if ! node -e "process.exit(require('semver').satisfies('$SDK_VER','$RANGE')?0:1)" 2>/dev/null; then
              BAD="$BAD  $NAME requires '$RANGE' but adapter-sdk being published is $SDK_VER"$'\n'
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::plugin peer ranges do not admit the adapter-sdk version being published:"
            printf '%s' "$BAD"
            exit 1
          fi
          echo "adapter-sdk $SDK_VER satisfies every plugin peer range"

      - name: Verify the CHANGELOG documents this version
        # MUST run before `npm publish`. The release step later in this job also
        # needs these notes, but it runs AFTER the publish — so if that were the
        # only check, a missing CHANGELOG section would be caught only once the
        # version was already burned on npm (published, no release, red job).
        # Rendering the notes here makes an undocumented release abort while
        # aborting is still free, and the file is reused verbatim by the release
        # step so the two can never disagree.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! node scripts/changelog-section.mjs "$VERSION" > /tmp/release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION — refusing to publish an undocumented release. Add a '## [$VERSION]' section, then re-tag."
            exit 1
          fi
          echo "CHANGELOG section for $VERSION renders ($(wc -c < /tmp/release-notes.md) bytes of notes)."

      - name: Import maintainer public key
        # A fresh runner has an empty GPG keyring, so verify-tag would have
        # nothing to check against. We import the committed PUBLIC key, but we do
        # NOT blindly trust it: an attacker who can push a v* tag could also swap
        # .github/maintainer-pubkey.asc for their own key (the workflow runs from
        # the pushed ref). So we PIN the expected fingerprint in a repo/org secret
        # (MAINTAINER_KEY_FPR) — which a tag pusher cannot change — and refuse to
        # trust any imported key whose fingerprint doesn't match. Fail-closed: the
        # secret MUST be set (no pin ⇒ no publish).
        env:
          EXPECTED_FPR: ${{ secrets.MAINTAINER_KEY_FPR }}
        run: |
          if [ -z "$EXPECTED_FPR" ]; then
            echo "::error::MAINTAINER_KEY_FPR secret is not set — refusing to publish (fail-closed). Set it to the maintainer key's full fingerprint in repo/org secrets."
            exit 1
          fi
          gpg --batch --import .github/maintainer-pubkey.asc
          # The .asc lives on the (attacker-writable) pushed ref, so it could BUNDLE
          # a second, attacker key after the real one — git verify-tag / gpg --verify
          # exit 0 on ANY good signature in the keyring, so a bundled key would let an
          # attacker-signed tag pass. Require the keyring to contain EXACTLY ONE
          # primary key, so only the pinned key can ever validate the tag.
          NKEYS=$(gpg --list-keys --with-colons | grep -c '^pub:')
          if [ "$NKEYS" != "1" ]; then
            echo "::error::maintainer-pubkey.asc imported $NKEYS keys, expected exactly 1 — refusing (a second key may have been appended to validate a rogue tag)."
            exit 1
          fi
          FPR=$(gpg --list-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          # Normalize (strip spaces, upcase) and compare against the pinned value.
          NORM_FPR=$(echo "$FPR" | tr -d ' ' | tr 'a-f' 'A-F')
          NORM_EXP=$(echo "$EXPECTED_FPR" | tr -d ' ' | tr 'a-f' 'A-F')
          if [ "$NORM_FPR" != "$NORM_EXP" ]; then
            echo "::error::Imported maintainer key fingerprint ($NORM_FPR) does not match the pinned MAINTAINER_KEY_FPR — refusing to publish (the in-repo pubkey may have been swapped)."
            exit 1
          fi
          echo "$FPR:6:" | gpg --batch --import-ownertrust
          echo "Maintainer key fingerprint matches the pinned secret (single key in keyring)."

      - name: Verify tag is GPG-signed
        # Refuse to publish unsigned tags. Operators verify the same way via
        # `git tag -v <tag>` (see docs/VERIFY.md). Prevents tag-rewrite +
        # bus-factor accidents (random maintainer pushing a bare tag).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # pipefail because this step's verdict IS an exit status: piping the check into
          # anything makes the pipeline report the LAST command. `if ! git verify-tag … | tee`
          # read tee's always-zero status, so this gate never fired and an unsigned v6.6.3
          # published. GitHub's default step shell is `bash -e {0}` — no pipefail — hence both
          # the flag and the redirect below. Asserted by src/publish-workflow.test.ts, and the
          # pattern is now caught repo-wide by self-audit R1-fail-open-ci.
          set -o pipefail
          # The maintainer public key was imported + trusted in the previous
          # step, so git verify-tag can now check the signature chain.
          if ! git verify-tag "$TAG" > /tmp/tag-verify.log 2>&1; then
            cat /tmp/tag-verify.log
            if grep -q 'no signature found' /tmp/tag-verify.log; then
              echo "::error::Tag $TAG is not GPG-signed. Sign with: git tag -s $TAG"
              exit 1
            fi
            echo "::error::Tag $TAG signature is invalid."
            cat /tmp/tag-verify.log
            exit 1
          fi
          echo "Tag $TAG signature verified."

      - name: npm audit (high+)
        # Refuse to publish a tarball that ships a known-high CVE.
        run: npm audit --audit-level=high

      - name: Bumblebee supply-chain gate
        # Refuse to publish if any installed pkg matches a known-compromise
        # catalog (Shai-Hulud, typosquats, credential stealers, ...).
        # Uses the deep profile against the checked-out repo.
        env:
          KIT_BUMBLEBEE_PROFILE: deep
          KIT_BUMBLEBEE_ROOTS: "."
          # Fail CLOSED: a scanner that couldn't run (unavailable / timeout /
          # incomplete) must BLOCK the publish, never warn-and-pass an unscanned
          # release as supply-chain-clean.
          KIT_BUMBLEBEE_REQUIRED: "1"
        run: |
          npm run build
          node scripts/run-supply-chain-check.mjs

      - name: Run tests
        run: npm test

      - name: Build production artifacts
        run: npm run build:prod

      - name: Resolve npm dist-tag (prerelease → next, stable → latest)
        # A SemVer prerelease (version contains a hyphen, e.g. 5.0.0-alpha.1) MUST
        # NOT become npm's `latest` — otherwise a plain `npm i sandstream-kit`
        # would hand every user an alpha. Publish those under `next` so `latest`
        # only ever moves on a stable release. Fail-closed: an unreadable/invalid
        # version aborts the publish rather than guessing `latest`.
        id: disttag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::could not read package.json version"; exit 1
          fi
          case "$VERSION" in
            *-*) TAG="next" ;;   # any prerelease identifier
            *)   TAG="latest" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$TAG'"

      - name: Show what will be published
        # `npm publish --dry-run` lists the exact files going into the tarball
        # and prints the tarball SHA — gives auditors a verifiable trail.
        run: npm publish --dry-run --tag ${{ steps.disttag.outputs.tag }}

      - name: Publish to npm with provenance
        # No NODE_AUTH_TOKEN: the credential comes from this job's OIDC identity, exchanged
        # against the package's trusted publisher. npm PREFERS a token whenever one is
        # present, so re-adding it would silently move publishing back onto the credential
        # npm is retiring — src/publish-workflow.test.ts fails if any executing line carries
        # one.
        #
        # --provenance stays: provenance is automatic under trusted publishing, so the flag
        # is a no-op there and states the intent explicitly. Generates an SLSA build
        # provenance attestation signed by the GitHub Actions OIDC identity. Consumers can
        # verify with:
        #   npm audit signatures
        # or
        #   npm view sandstream-kit --json | jq '.dist'
        # --tag routes prereleases to `next` (see the resolve step) so they never
        # clobber `latest`.
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}

      - name: Publish the adapter SDK and first-party plugins
        # WHY THIS EXISTS: `packages/` is not in the root tarball (files: ["dist","README.md",
        # "skills"]), and plugin-loader.ts resolves plugins by PACKAGE NAME out of the project's
        # node_modules. So an unpublished workspace is unreachable to every user who has not
        # cloned the monorepo — while docs/OWASP_2025.md advertised the snyk/wiz plugins as
        # shipped controls and PLUGIN_AUTHORING.md told third-party authors to run
        # `npm install --save-dev sandstream-kit-adapter-sdk`. That name returned 404, i.e. it was
        # unregistered and claimable: a dependency-confusion invitation created by our own docs.
        # Owning a name you publicly instruct people to install is the defensive position.
        #
        # ORDER MATTERS: adapter-sdk first — four plugins (github, railway, supabase, vercel)
        # declare it as a peerDependency, so publishing them against a missing peer would ship a
        # broken install. Root package went out in the step above, before either: the CLI is the
        # primary artifact and must not be held hostage to a plugin failure.
        #
        # IDEMPOTENT: each package is skipped when that exact version is already on the registry,
        # so re-running the job after a partial failure completes the set instead of dying on
        # EPUBLISHCONFLICT. Never continue-on-error — a publish that silently did not happen is
        # the false green this repo exists to prevent.
        env:
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: |
          set -euo pipefail
          publish_ws() {
            dir="$1"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "· $name@$version already on npm — skipping"
              return 0
            fi
            echo "→ publishing $name@$version (dist-tag $DIST_TAG)"
            npm publish --workspace "$name" --provenance --access public --tag "$DIST_TAG"
          }

          # The peer dependency first.
          publish_ws packages/adapter-sdk

          # Then every other workspace, in a stable (sorted) order so the log is diffable.
          for dir in $(ls -d packages/*/ | sed 's:/$::' | sort); do
            [ "$dir" = "packages/adapter-sdk" ] && continue
            publish_ws "$dir"
          done

      - name: Create GitHub release
        # MUST run before the SBOM steps: `anchore/sbom-action` attaches its
        # output to the tag's release (upload-release-assets defaults to true),
        # and the final upload step targets it too. Historically this workflow
        # created no release at all, so every SBOM step silently no-opped and
        # the SBOMs only ever survived as workflow artifacts (which expire).
        #
        # Notes are the file rendered by the "Verify the CHANGELOG documents this
        # version" step near the top of the job — reused verbatim rather than
        # regenerated, so the pre-publish check and the published notes can never
        # disagree. Idempotent: re-running on an existing release reuses it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
            exit 0
          fi
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::/tmp/release-notes.md is missing or empty — the pre-publish CHANGELOG step should have produced it."
            exit 1
          fi
          # --verify-tag: refuse to invent a release for a tag that isn't on the
          # remote. Prereleases are flagged so they don't read as stable.
          EXTRA=""
          case "$VERSION" in *-*) EXTRA="--prerelease" ;; esac
          # shellcheck disable=SC2086  # EXTRA is a controlled, single-flag value
          gh release create "$TAG" \
            --title "kit $VERSION" \
            --notes-file /tmp/release-notes.md \
            --verify-tag $EXTRA
          echo "Created release $TAG"

      - name: Name the SBOM's root component
        # Without this, syft records the scanned path (".") as the root
        # component, so the SBOM cannot say which release it describes — a
        # consumer holding the bare file has no version to go on. syft reads
        # source.name / source.version from its config file.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          printf 'source:\n  name: %s\n  version: %s\n' "$PKG_NAME" "$VERSION" > .syft.yaml
          cat .syft.yaml

      - name: Pack the tarball to attest
        # ONE subject, and the one that matters: the tarball a consumer actually installs.
        # `subject-path: dist/**/*` passed 1920 subjects and the action's hard limit is 1024, so
        # for every release it errored in 327ms with "Too many subjects specified (>1024)" — and
        # `continue-on-error` turned that into a green step. docs/VERIFY.md step 2 promised a
        # signed manifest attached to the release; nothing was ever attached, and
        # `gh attestation verify` would have found no attestation at all. Packing first also makes
        # the subject digest identical to what npm published, so the GitHub attestation and the
        # npm provenance describe the same bytes instead of two different views of the build.
        if: always()
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL"

      - name: Generate GitHub artifact attestation
        # Independent of npm provenance — attaches a signed provenance statement for the published
        # tarball to this repo's attestation store, verifiable with:
        #   gh attestation verify <tarball> --repo sandstream/kit
        # timeout-minutes guards against Sigstore (Fulcio/Rekor) hangs, which once left this step
        # running ~15min; npm publish already succeeded by here, so a slow attestation must fail
        # fast (continue-on-error) not block.
        if: always()
        id: attest
        timeout-minutes: 5
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true # kit-self-audit: allow-continue-on-error
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Report the attestation outcome loudly
        # `continue-on-error` is deliberate — a Sigstore hang must not strand a release whose npm
        # publish already succeeded. But it also reports the step's conclusion as SUCCESS to the
        # jobs API while the log says failure, which is how a broken attestation survived every
        # release unnoticed. This step cannot block; it exists so the failure is impossible to
        # read as green: an annotation on the run and a line in the job summary.
        if: always()
        env:
          OUTCOME: ${{ steps.attest.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "✅ GitHub artifact attestation created for ${{ steps.pack.outputs.tarball }}" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No GitHub artifact attestation::the attest step did not succeed (outcome=$OUTCOME); this release has npm provenance but NO GitHub attestation — 'gh attestation verify' will find nothing"
            echo "⚠️ **No GitHub artifact attestation** for this release (attest outcome: \`$OUTCOME\`). npm provenance is unaffected; \`gh attestation verify\` will find nothing." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate SBOM (CycloneDX)
        # CycloneDX SBOM is required by EU CRA and US EO 14028 for shipped
        # software. Lets downstream consumers introspect the dep tree.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          config: .syft.yaml # names the root component (see the step above)
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json

      - name: Generate SBOM (SPDX)
        # Some consumers (e.g. RHEL, federal) require SPDX format.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          config: .syft.yaml # names the root component (see the step above)
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: Attach SBOMs to GitHub release
        # The release is created earlier in this job, so a failure here is a real
        # failure — no `|| true`. Previously this swallowed everything and the
        # SBOMs quietly never reached a release for any version up to 5.10.0.
        # --clobber makes it idempotent whether or not sbom-action already
        # uploaded them itself.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" sbom.cyclonedx.json sbom.spdx.json --clobber
          # Fail-closed proof: re-read the release and require both assets, so a
          # silent API no-op can't pass as an attached SBOM.
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")')"
          for want in sbom.cyclonedx.json sbom.spdx.json; do
            case "$ASSETS" in
              *"$want"*) ;;
              *) echo "::error::$want missing from release $TAG (assets: $ASSETS)"; exit 1 ;;
            esac
          done
          echo "Release $TAG carries: $ASSETS"
