name: Docker Build & Push

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions: {}

env:
  REGISTRY: docker.io
  IMAGE_NAME: sandstream/kit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # cosign keyless signing via Sigstore OIDC
      security-events: write # upload Trivy SARIF to Code Scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-flags: --debug

      # Docker Hub creds — only attempt login when both secrets are set.
      # Master pushes without creds previously hard-failed; now they
      # build-only (no push) until DOCKER_USERNAME/PASSWORD are configured.
      - name: Check Docker Hub creds present
        id: docker-creds
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME/DOCKER_PASSWORD secrets not set — skipping push to ${REGISTRY}"
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.present == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (CLI)
        id: meta-cli
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once and load the exact image Trivy and PR smoke tests will use.
      # Publication happens only after the vulnerability gate passes.
      - name: Build CLI image locally
        id: build-cli
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: kit:scan
          labels: ${{ steps.meta-cli.outputs.labels }}
          cache-from: |
            type=gha,scope=cli
            ${{ steps.docker-creds.outputs.present == 'true' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: type=gha,scope=cli,mode=max

      - name: Image vulnerability scan
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kit:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        # Preserve findings when the scan rejects the image. SARIF availability
        # must not turn a failed vulnerability gate into a successful publish.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true # kit-self-audit: allow-continue-on-error
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif

      - name: Push scanned CLI image
        id: push-cli
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.present == 'true' && steps.scan.outcome == 'success'
        env:
          TAGS: ${{ steps.meta-cli.outputs.tags }}
        run: |
          digest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag kit:scan "$tag"
            docker push "$tag"
            pushed_digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            if [[ ! "$pushed_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Cannot resolve registry digest for $tag" >&2
              exit 1
            fi
            if [ -n "$digest" ] && [ "$digest" != "$pushed_digest" ]; then
              echo "::error::Published tags have different image digests" >&2
              exit 1
            fi
            digest="$pushed_digest"
          done <<< "$TAGS"
          if [ -z "$digest" ]; then
            echo "::error::No Docker image tags to push" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Sigstore keyless signing — only when an image was actually pushed.
      # Consumers verify with:
      #   cosign verify <image> --certificate-identity-regexp '...'
      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.present == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"

      - name: Sign CLI image (keyless)
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.present == 'true' && steps.push-cli.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push-cli.outputs.digest }}
          TAGS: ${{ steps.meta-cli.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      # SBOM per image — attached to the registry alongside the signature.
      - name: Generate SBOM for CLI image
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.present == 'true' && steps.push-cli.outputs.digest != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push-cli.outputs.digest }}
          format: cyclonedx-json
          artifact-name: cli-sbom.cyclonedx.json
          output-file: cli-sbom.cyclonedx.json
          upload-release-assets: false

      - name: Attest CLI image SBOM
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.present == 'true' && steps.push-cli.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push-cli.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate cli-sbom.cyclonedx.json --type cyclonedx \
            "${IMAGE}@${DIGEST}"

      - name: Test CLI image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm kit:scan --version
          docker run --rm kit:scan --help

      - name: Comment PR with image details
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Docker image built, scanned, and smoke-tested in CI. The PR image is local to this run and is not published.'
            })
